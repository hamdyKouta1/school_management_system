# Application Configuration Properties
# This file consolidates hard-coded configuration values, constants, and environment-specific settings.
# Use key=value pairs, grouped by logical categories, with lowercase underscored keys.
# Environment-specific overrides are supported via ".dev", ".staging", and ".prod" suffixes per key.
# IMPORTANT: Do not commit real secrets. Override sensitive values per environment.

# =====================
# API
# =====================
# Base URL used by documentation/tools for targeting backend API
api.base_url=http://localhost:8081/api
# Development override
api.base_url.dev=http://localhost:8081/api
# Staging override
api.base_url.staging=http://staging.example.com:8081/api
# Production override
api.base_url.prod=https://api.example.com/api

# =====================
# ADMIN
# =====================
# Admin email address for notifications and OTP delivery
admin.email=hamdyhkouta@gmail.com
# Secret code required to assign ADMIN role during registration
admin.secret_code=123456
# Development override
admin.email.dev=hamdyhkouta@gmail.com
admin.secret_code.dev=123456
# Staging override
admin.email.staging=admin@example.com
admin.secret_code.staging=
# Production override
admin.email.prod=admin@example.com
admin.secret_code.prod=

# =====================
# BULK UPLOAD
# =====================
# Path to the Excel template used by the bulk student import servlet
bulk_upload.template_path=student_batch_template.xlsx
# Development override
bulk_upload.template_path.dev=student_batch_template.xlsx
# Staging override
bulk_upload.template_path.staging=/opt/app/templates/student_batch_template.xlsx
# Production override
bulk_upload.template_path.prod=/opt/app/templates/student_batch_template.xlsx

# =====================
# CORS
# =====================
# Allow credentials in CORS requests (true/false)
cors.allow_credentials=true
# Allowed request headers for CORS
cors.allowed_headers=Accept,Authorization,Content-Length,Content-Type,Origin,X-Requested-With,ngrok-skip-browser-warning
# Allowed HTTP methods for CORS
cors.allowed_methods=DELETE,GET,OPTIONS,POST,PUT
# Allowed origins for CORS (use * for all, or set specific origin)
cors.allowed_origins=*
# Development overrides
cors.allow_credentials.dev=true
cors.allowed_headers.dev=Accept,Authorization,Content-Length,Content-Type,Origin,X-Requested-With,ngrok-skip-browser-warning
cors.allowed_methods.dev=DELETE,GET,OPTIONS,POST,PUT
cors.allowed_origins.dev=*
# Staging overrides
cors.allow_credentials.staging=true
cors.allowed_headers.staging=Accept,Authorization,Content-Length,Content-Type,Origin,X-Requested-With
cors.allowed_methods.staging=DELETE,GET,OPTIONS,POST,PUT
cors.allowed_origins.staging=https://staging-frontend.example.com
# Production overrides
cors.allow_credentials.prod=true
cors.allowed_headers.prod=Accept,Authorization,Content-Length,Content-Type,Origin,X-Requested-With
cors.allowed_methods.prod=DELETE,GET,OPTIONS,POST,PUT
cors.allowed_origins.prod=https://frontend.example.com

# =====================
# CSRF
# =====================
# Allowed origin for CSRF validation (must exactly match frontend origin)
security.csrf.allowed_origin=*
# Development override
security.csrf.allowed_origin.dev=http://localhost:5173
# Staging override
security.csrf.allowed_origin.staging=https://staging-frontend.example.com
# Production override
security.csrf.allowed_origin.prod=https://frontend.example.com

# =====================
# DATABASE
# =====================
# JDBC driver class name used by the application
db.driver=org.postgresql.Driver
# Database password (sensitive)
db.password=123
# JDBC connection URL
db.url=jdbc:postgresql://localhost:5432/canal_prep_school_clone
# Database username
db.username=postgres
# Development overrides
db.password.dev=123
db.url.dev=jdbc:postgresql://localhost:5432/canal_prep_school_clone
db.username.dev=postgres
# Staging overrides
db.password.staging=
db.url.staging=jdbc:postgresql://staging-db.example.com:5432/school
db.username.staging=school_user
# Production overrides
db.password.prod=
db.url.prod=jdbc:postgresql://prod-db.example.com:5432/school
db.username.prod=school_user

# =====================
# EMAIL / SMTP
# =====================
# Enable SMTP authentication
email.auth.enable=true
# Default FROM address used for sending emails
email.from_address=canalprepschool@gmail.com
# SMTP host name
email.host=smtp.gmail.com
# SMTP password (sensitive) - SECURITY: Replace with environment variable or secure vault in production
email.password=
# SMTP port (587 for TLS)
email.port=587
# Enable STARTTLS for SMTP
email.tls.enable=true
# Development override (for testing only)
email.password.dev=eebb hamx ycyp pvui
# Staging override (use environment variable)
email.password.staging=
# Production override (use environment variable or secure vault)
email.password.prod=
# SMTP username
email.username=canalprepschool@gmail.com
# Development overrides
email.auth.enable.dev=true
email.from_address.dev=canalprepschool@gmail.com
email.host.dev=smtp.gmail.com
email.password.dev=
email.port.dev=587
email.tls.enable.dev=true
email.username.dev=canalprepschool@gmail.com
# Staging overrides
email.auth.enable.staging=true
email.from_address.staging=no-reply@staging.example.com
email.host.staging=smtp.staging.example.com
email.password.staging=
email.port.staging=587
email.tls.enable.staging=true
email.username.staging=no-reply@staging.example.com
# Production overrides
email.auth.enable.prod=true
email.from_address.prod=no-reply@example.com
email.host.prod=smtp.example.com
email.password.prod=
email.port.prod=587
email.tls.enable.prod=true
email.username.prod=no-reply@example.com

# =====================
# JWT
# =====================
# JWT token expiration time in milliseconds (default: 30 minutes)
jwt.expiration_ms=1800000
# JWT secret key used to sign tokens (sensitive) - must be at least 256 bits (32 characters)
jwt.secret=development-jwt-secret-key-for-testing-only-not-for-production-use-must-be-at-least-32-chars
# Development overrides
jwt.expiration_ms.dev=1800000
jwt.secret.dev=dev_secret_key
# Staging overrides
jwt.expiration_ms.staging=1800000
jwt.secret.staging=
# Production overrides
jwt.expiration_ms.prod=1800000
jwt.secret.prod=

# =====================
# ATTENDANCE SCHEDULER
# =====================
# Daily attendance update time (24-hour format: HH:mm)
attendance.schedule.time=17:00
attendance.schedule.enabled=true
attendance.schedule.timezone=UTC
# Development overrides
attendance.schedule.time.dev=16:30
attendance.schedule.enabled.dev=true
attendance.schedule.timezone.dev=UTC
# Staging overrides
attendance.schedule.time.staging=17:00
attendance.schedule.enabled.staging=true
attendance.schedule.timezone.staging=UTC
# Production overrides
attendance.schedule.time.prod=16:30
attendance.schedule.enabled.prod=true
attendance.schedule.timezone.prod=UTC

# =====================
# NGROK / TUNNELING
# =====================
# Additional header used by ngrok to suppress browser warnings (included in CORS allowed headers)
ngrok.allowed_header=ngrok-skip-browser-warning

# =====================
# OTP
# =====================
# Allowed OTP operations (must match database constraint)
otp.operations.allowed=ADMIN_CREATION,PASSWORD_RESET,REMOVE,RENEW

# =====================
# SERVER
# =====================
# Bind address for the HTTP server
server.bind_address=0.0.0.0
# Port for the HTTP server
server.port=8081
# Development overrides
server.bind_address.dev=0.0.0.0
server.port.dev=8081
# Staging overrides
server.bind_address.staging=0.0.0.0
server.port.staging=8081
# Production overrides
server.bind_address.prod=0.0.0.0
server.port.prod=8081

# =====================
# UI
# =====================
# Base URL of the frontend application (used by CSRF and docs)
ui.base_url=* #//http://localhost:5173
# Development override
ui.base_url.dev=* #//http://localhost:5173
# Staging override
ui.base_url.staging=* #https://staging-frontend.example.com
# Production override
ui.base_url.prod=* #https://frontend.example.com