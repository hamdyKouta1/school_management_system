# School Management System - Logging Configuration
# This file configures Java's built-in logging framework (java.util.logging)

# Root logger level - controls overall logging verbosity
.level = INFO

# Console handler configuration
handlers = java.util.logging.ConsoleHandler, java.util.logging.FileHandler

# Console Handler Settings
java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format = %1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS [%4$s] %2$s: %5$s%6$s%n

# File Handler Settings - Main Application Log
java.util.logging.FileHandler.level = ALL
java.util.logging.FileHandler.pattern = logs/application/school-management-%g.log
java.util.logging.FileHandler.limit = 10485760
java.util.logging.FileHandler.count = 10
java.util.logging.FileHandler.append = true
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter

# Package-specific logging levels
com.canalprep.level = INFO
com.canalprep.auth.level = INFO
com.canalprep.servlet.level = INFO
com.canalprep.dao.level = INFO
com.canalprep.main.level = INFO

# Database logging
com.canalprep.dao.DBConnection.level = INFO

# Authentication logging
com.canalprep.auth.servlets.AuthServlet.level = INFO
com.canalprep.auth.filter.AuthenticationFilter.level = INFO

# Servlet logging
com.canalprep.servlet.StudentServlet.level = INFO
com.canalprep.servlet.AttendanceServlet.level = INFO
com.canalprep.servlet.DashboardServlet.level = INFO

# Third-party library logging levels
org.eclipse.jetty.level = WARNING
org.postgresql.level = WARNING

# Security logging - more verbose for security-related events
com.canalprep.auth.level = FINE

# Error logging - capture all errors
java.util.logging.ErrorManager.level = SEVERE